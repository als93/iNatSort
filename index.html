<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>iNatSort</title>
  <style>
    :root {
      --bg: #f4f7f3;
      --surface: #ffffff;
      --surface-alt: #edf3ee;
      --text: #18252b;
      --muted: #5a6a6d;
      --line: #d3ddd5;
      --accent: #26653e;
      --accent-soft: rgba(38, 101, 62, 0.12);
      --danger: #b6291a;
      --danger-soft: rgba(182, 41, 26, 0.08);
      --shadow: 0 18px 48px rgba(16, 24, 20, 0.12);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg); color: var(--text);
    }
    body { padding: 20px; }
    button, input { font: inherit; }
    .app { max-width: 1220px; margin: 0 auto; }

    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex; align-items: center; gap: 12px;
      font-weight: 700;
    }

    .brand-mark {
      width: 28px; height: 28px;
      display: grid; place-items: center;
      border-radius: 9px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .status {
      display: inline-flex; align-items: center; gap: 9px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--surface-alt);
      color: var(--muted);
      font-size: 0.82rem;
      border: 1px solid var(--line);
    }

    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--accent);
    }

    .layout {
      display: grid; grid-template-columns: 1.2fr 0.8fr;
      gap: 20px; margin-top: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .obs { padding: 20px; }

    .photo-wrap {
      min-height: 360px;
      display: grid; place-items: center;
      background: #0d1110;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }

    .photo-wrap img {
      width: 100%; max-height: 540px; display: block;
      object-fit: contain;
    }

    .meta {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0; margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 14px; overflow: hidden;
    }

    .meta-item {
      padding: 14px 16px;
      border-right: 1px solid var(--line);
    }

    .meta-item:last-child { border-right: none; }

    .label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .control-panel { padding: 18px; }

    .field {
      width: 100%; padding: 12px 14px;
      background: var(--surface-alt);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      outline: none;
    }

    .field:focus {
      border-color: rgba(38, 101, 62, 0.5);
      box-shadow: 0 0 0 3px rgba(38, 101, 62, 0.12);
    }

    .search-wrap { position: relative; }
    .search-wrap input { padding-left: 38px; }

    .search-wrap .icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--muted);
    }

    .results {
      display: none;
      margin-top: 10px; max-height: 220px; overflow: auto;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 12px;
    }

    .result-item {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; border: 0; border-bottom: 1px solid var(--line); background: transparent;
      padding: 10px 12px; cursor: pointer; text-align: left;
    }

    .result-item:last-child { border-bottom: none; }
    .result-item:hover { background: var(--surface-alt); }

    .result-name { font-weight: 600; }
    .result-rank { font-size: 0.8rem; color: var(--muted); }

    .selected {
      margin-top: 16px; padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--accent-soft);
    }

    .section { margin-top: 18px; }

    .section-title {
      margin: 0 0 12px;
      font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted);
    }

    .group-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .group-button, .button {
      border: 1px solid var(--line);
      background: var(--surface-alt);
      border-radius: 12px;
      padding: 12px 10px;
      cursor: pointer;
      color: var(--text);
      font-weight: 600;
    }

    .group-button:hover, .button:hover { border-color: rgba(38, 101, 62, 0.5); }

    .actions {
      display: grid; grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
    }

    .button.danger {
      background: var(--danger-soft);
      border-color: rgba(182, 41, 26, 0.2);
      color: var(--danger);
    }

    .note {
      margin-top: 16px; padding: 12px 14px;
      border-radius: 12px; background: var(--surface-alt);
      border: 1px solid var(--line); color: var(--muted);
      font-size: 0.9rem;
    }

    .hidden { display: none !important; }

    @media (max-width: 850px) {
      .layout { grid-template-columns: 1fr; }
      .meta { grid-template-columns: 1fr; }
      .meta-item { border-right: 0; border-bottom: 1px solid var(--line); }
      .meta-item:last-child { border-bottom: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">✦</div>
        <div>iNatSort</div>
      </div>
      <div class="status"><span class="dot"></span><span id="status-text">Live taxon validation enabled</span></div>
    </header>

    <main class="layout">
      <section class="card obs">
        <div class="photo-wrap">
          <img id="photo" alt="Observation" src="https://images.unsplash.com/photo-1471193945509-9ad0617afabf?auto=format&fit=crop&w=1200&q=80" />
        </div>

        <div class="meta">
          <div class="meta-item">
            <span class="label">Observed</span>
            <div id="obs-date">2026-11-08</div>
          </div>
          <div class="meta-item">
            <span class="label">Location</span>
            <div id="obs-place">Point Reyes, CA</div>
          </div>
          <div class="meta-item">
            <span class="label">License / Grade</span>
            <div id="obs-grade">CC-BY-NC</div>
          </div>
        </div>
      </section>

      <aside class="card control-panel">
        <div class="search-wrap">
          <span class="icon">⌕</span>
          <input id="taxon-search" class="field" type="text" placeholder="Search any taxon..." aria-label="Search any taxon" />
        </div>
        <div id="taxon-results" class="results" aria-live="polite"></div>

        <div id="selected-taxon" class="selected hidden"></div>

        <div class="section">
          <h3 class="section-title">Groups</h3>
          <div id="group-grid" class="group-grid"></div>
        </div>

        <div class="section">
          <h3 class="section-title">Special actions</h3>
          <div class="actions">
            <button class="button danger" type="button" id="no-organism">No organism</button>
            <button class="button" type="button" id="cultivated">Captive / cultivated</button>
          </div>
        </div>

        <div class="note">
          The app validates taxon IDs through live iNaturalist calls only. Cached matches are kept only after a successful live lookup; failed lookups are not trusted.
        </div>
      </aside>
    </main>
  </div>

  <script>
    const DEFAULT_GROUPS = [
      { key: '1', name: 'Plants & Algae', generalName: 'General Plants (Plantae)' },
      { key: '2', name: 'Insects', generalName: 'General Insects (Insecta)' },
      { key: '3', name: 'Birds', generalName: 'General Birds (Aves)' },
      { key: '4', name: 'Fungi & Slime Molds', generalName: 'General Fungi (Fungi)' },
      { key: '5', name: 'Mammals', generalName: 'General Mammals (Mammalia)' },
      { key: '6', name: 'Reptiles & Amphibians', generalName: 'Reptiles (Reptilia)' },
      { key: '7', name: 'Fish', generalName: 'General Fish (Actinopterygii)' },
      { key: '8', name: 'Arachnids', generalName: 'General Arachnids (Arachnida)' },
      { key: '9', name: 'Mollusks', generalName: 'General Mollusks (Mollusca)' },
      { key: '0', name: 'Other', generalName: 'Life' }
    ];

    const CACHE_KEY = 'inatSort.taxaCache.v1';

    const AppState = {
      taxaCache: {},
      selectedTaxon: null,
      latestRequestId: 0,
      statusEl: null,
      searchInputEl: null,
      resultsEl: null,
      selectedTaxonEl: null
    };

    const Storage = {
      loadTaxaCache() {
        try {
          const raw = window.localStorage.getItem(CACHE_KEY);
          AppState.taxaCache = raw ? JSON.parse(raw) : {};
        } catch (error) {
          console.warn('Unable to read taxon cache:', error);
          AppState.taxaCache = {};
        }
      },

      saveTaxaCache() {
        try {
          window.localStorage.setItem(CACHE_KEY, JSON.stringify(AppState.taxaCache));
        } catch (error) {
          console.warn('Unable to persist taxon cache:', error);
        }
      }
    };

    const TaxonService = {
      normalizeKey(value) {
        return String(value || '').trim().toLowerCase();
      },

      escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#039;');
      },

      getCached(query) {
        const key = this.normalizeKey(query);
        return AppState.taxaCache[key] || null;
      },

      async autocomplete(query) {
        const term = String(query || '').trim();
        if (!term) return [];

        const endpoint = `https://api.inaturalist.org/v1/taxa/autocomplete?per_page=5&q=${encodeURIComponent(term)}`;
        const response = await fetch(endpoint, {
          headers: { Accept: 'application/json' }
        });

        if (!response.ok) {
          throw new Error('Taxon lookup failed');
        }

        const payload = await response.json();
        const results = Array.isArray(payload && payload.results) ? payload.results.filter(Boolean) : [];
        return results;
      },

      chooseBestMatch(rawQuery, results) {
        const query = String(rawQuery || '').trim().toLowerCase();
        if (!results.length) return null;

        const exactName = results.find(item => {
          const candidate = String(item && (item.name || item.preferred_common_name || '')).trim().toLowerCase();
          return candidate === query;
        });

        if (exactName) return exactName;
        return results[0];
      },

      async resolve(query) {
        const key = this.normalizeKey(query);
        const cached = AppState.taxaCache[key];
        if (cached && Number.isFinite(cached.id)) {
          return cached;
        }

        const results = await this.autocomplete(query);
        if (!results.length) {
          throw new Error('No taxon matches found');
        }

        const selected = this.chooseBestMatch(query, results);
        const id = Number(selected && selected.id);
        if (!Number.isFinite(id)) {
          throw new Error('Invalid taxon id returned by iNaturalist');
        }

        const verifiedTaxon = {
          id,
          name: selected.name || selected.preferred_common_name || query,
          preferred_common_name: selected.preferred_common_name || selected.common_name || '',
          rank: selected.rank || 'taxon',
          validatedAt: Date.now()
        };

        AppState.taxaCache[key] = verifiedTaxon;
        Storage.saveTaxaCache();
        return verifiedTaxon;
      }
    };

    const UI = {
      getStatusElement() {
        if (!AppState.statusEl) {
          AppState.statusEl = document.getElementById('status-text');
        }
        return AppState.statusEl;
      },

      setStatus(message) {
        this.getStatusElement().textContent = message;
      },

      renderGroups() {
        const container = document.getElementById('group-grid');
        container.innerHTML = DEFAULT_GROUPS.map(group => `
          <button type="button" class="group-button" data-group="${TaxonService.escapeHtml(group.generalName)}">
            ${TaxonService.escapeHtml(group.name)}
          </button>
        `).join('');

        container.querySelectorAll('.group-button').forEach(button => {
          button.addEventListener('click', () => {
            const groupName = button.getAttribute('data-group');
            handleTaxonSelection(groupName);
          });
        });
      },

      renderSelectedTaxon() {
        if (!AppState.selectedTaxonEl) {
          AppState.selectedTaxonEl = document.getElementById('selected-taxon');
        }

        const el = AppState.selectedTaxonEl;
        if (!AppState.selectedTaxon) {
          el.classList.add('hidden');
          el.textContent = '';
          return;
        }

        const { name, preferred_common_name, id } = AppState.selectedTaxon;
        el.classList.remove('hidden');
        el.innerHTML = `
          <strong>Selected:</strong> ${TaxonService.escapeHtml(name)}
          ${preferred_common_name ? `(${TaxonService.escapeHtml(preferred_common_name)})` : ''}
          <div style="font-size:0.78rem;color:var(--muted);margin-top:6px;">iNaturalist ID: ${TaxonService.escapeHtml(id)}</div>
        `;
      },

      renderResults(items) {
        if (!AppState.resultsEl) {
          AppState.resultsEl = document.getElementById('taxon-results');
        }

        const el = AppState.resultsEl;
        if (!items.length) {
          el.innerHTML = '';
          el.style.display = 'none';
          return;
        }

        el.innerHTML = items.map(item => `
          <button type="button" class="result-item" data-name="${TaxonService.escapeHtml(item.name || item.preferred_common_name || 'Unknown')}">
            <div>
              <div class="result-name">${TaxonService.escapeHtml(item.name || 'Unknown')}</div>
              <div class="result-rank">${TaxonService.escapeHtml(item.rank || 'Taxon')}</div>
            </div>
            <div>${TaxonService.escapeHtml(item.id || '')}</div>
          </button>
        `).join('');

        el.querySelectorAll('.result-item').forEach(button => {
          button.addEventListener('click', () => {
            const selectedName = button.getAttribute('data-name');
            if (!AppState.searchInputEl) {
              AppState.searchInputEl = document.getElementById('taxon-search');
            }
            AppState.searchInputEl.value = selectedName;
            el.style.display = 'none';
            handleTaxonSelection(selectedName);
          });
        });

        el.style.display = 'block';
      },

      clearResults() {
        if (!AppState.resultsEl) {
          AppState.resultsEl = document.getElementById('taxon-results');
        }
        AppState.resultsEl.innerHTML = '';
        AppState.resultsEl.style.display = 'none';
      }
    };

    function handleTaxonSelection(name) {
      const value = String(name || '').trim();
      if (!value) return;

      UI.setStatus('Validating taxon against iNaturalist...');
      TaxonService.resolve(value)
        .then(taxon => {
          AppState.selectedTaxon = taxon;
          UI.renderSelectedTaxon();
          UI.setStatus(`Taxon verified: ${taxon.name}`);
        })
        .catch(() => {
          AppState.selectedTaxon = null;
          UI.renderSelectedTaxon();
          UI.setStatus('Taxon not found on iNaturalist');
        });
    }

    function handleSearchInput() {
      if (!AppState.searchInputEl) {
        AppState.searchInputEl = document.getElementById('taxon-search');
      }
      if (!AppState.resultsEl) {
        AppState.resultsEl = document.getElementById('taxon-results');
      }

      const query = AppState.searchInputEl.value.trim();
      if (!query) {
        UI.clearResults();
        return;
      }

      const requestId = ++AppState.latestRequestId;
      TaxonService.autocomplete(query)
        .then(results => {
          if (requestId !== AppState.latestRequestId) return;
          UI.renderResults(results);
        })
        .catch(() => {
          if (requestId !== AppState.latestRequestId) return;
          UI.clearResults();
        });
    }

    function bindEvents() {
      const searchInput = document.getElementById('taxon-search');
      searchInput.addEventListener('input', handleSearchInput);

      document.getElementById('no-organism').addEventListener('click', () => {
        UI.setStatus('No organism selected');
      });

      document.getElementById('cultivated').addEventListener('click', () => {
        UI.setStatus('Captive / cultivated marked');
      });
    }

    function initialize() {
      Storage.loadTaxaCache();
      UI.renderGroups();
      bindEvents();
      UI.renderSelectedTaxon();
      UI.setStatus('Live taxon validation enabled');
    }

    initialize();
  </script>
</body>
</html>
